name: core-pipeline-tests

on:
  push:
    branches: [main, robust-pipeline]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node railway-server/core/core.test.js
